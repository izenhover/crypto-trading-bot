# config/logging.yaml
version: 1
disable_existing_loggers: false

formats:
  default:
    format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"

handlers:
  console:
    sink: "sys.stdout"
    level: "INFO"
    colorize: true

  file_all:
    sink: "logs/all.log"
    level: "DEBUG"
    rotation: "10 MB"
    retention: "30 days"
    compression: "zip"
    encoding: "utf-8"

  file_errors:
    sink: "logs/errors.log"
    level: "ERROR"
    rotation: "10 MB"
    retention: "90 days"
    compression: "zip"
    encoding: "utf-8"
